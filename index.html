<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronograma de actividades · Recurso Hídrico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7F1; --surface:#FFFFFF; --ink:#1F2A1C; --muted:#5C6B57; --line:#D5E0CC;
  --verde:#285F19; --verde2:#43883D; --lima:#93C01F; --amarillo:#F8DC0B;
  --tinte:#EAF2E1; --tinte2:#F6F9F2; --warn:#8A5A00; --warn-soft:#FDF3C4; --on:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Ubuntu,"Segoe UI",Roboto,Arial,sans-serif;font-size:14.5px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--verde2);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:18px 18px 60px}

/* header like the excel */
.head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.head img{height:64px;width:auto;display:block}
.head .t h1{margin:0;font-size:clamp(18px,2.4vw,26px);font-weight:700;color:#285F19;letter-spacing:.01em}
.head .t p{display:inline-block;margin:8px 0 0;background:#D8E5B0;color:#285F19;font-size:clamp(18px,2.3vw,24px);font-weight:700;letter-spacing:.02em;padding:6px 16px;border-radius:10px;border-left:6px solid #F8DC0B}
.head .mbadge{background:#285F19;color:#fff;border-radius:10px;padding:8px 16px;text-align:center;font-weight:700;line-height:1.15}
.head .mbadge small{display:block;font-weight:400;font-size:12px;opacity:.85}
@media (max-width:700px){.head{grid-template-columns:1fr;text-align:left}.head img{height:48px}.head .mbadge{justify-self:start}}

.btn{border:0;border-radius:9px;padding:9px 15px;font-weight:500;background:var(--verde2);color:var(--on)}
.btn:hover{background:var(--verde)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--tinte)}
.btn.danger{background:transparent;color:#C20E1A;border:1px solid currentColor}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* quick entry */
.quick{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--lima);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.quick label{display:block;font-weight:700;margin-bottom:6px;color:var(--ink)}
.quick .row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.quick textarea{flex:1;min-width:240px;min-height:52px;resize:vertical;border:1px solid var(--line);background:var(--tinte2);border-radius:10px;padding:10px 12px}
.quick .acts{display:flex;flex-direction:column;gap:6px}
.quick .hint{color:var(--muted);font-size:12.5px;margin-top:6px}
.quick .st{font-size:13px;margin-top:6px;color:var(--verde2)}
.quick .st.err{color:#C20E1A}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.months{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.months button,.seg button{border:0;background:transparent;padding:7px 13px;border-radius:7px;font-weight:500;color:var(--muted)}
.months button b{font-weight:500}
.months button span{font-size:12px;margin-left:4px;opacity:.8}
.months button[aria-pressed="true"]{background:var(--verde);color:#fff}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button[aria-pressed="true"]{background:var(--tinte);color:var(--ink);font-weight:700}
.search{flex:1;min-width:180px;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;margin-left:auto}

/* summary strip */
.strip{display:grid;grid-template-columns:150px 1fr auto;gap:12px;margin-bottom:12px}
.kpi,.weeks,.pend{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi .n{font-size:34px;font-weight:700;color:var(--verde2);line-height:1}
.kpi p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.weeks{display:flex;gap:10px;align-items:flex-end;overflow-x:auto}
.wk{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;padding:2px 4px;border-radius:8px;font-size:12px;color:var(--muted)}
.wk .b{width:26px;background:var(--lima);border-radius:5px 5px 2px 2px;min-height:3px}
.wk b{color:var(--ink);font-size:13px}
.wk[aria-current="true"]{background:var(--tinte)}
.pend{font-size:13px;color:var(--muted);max-width:260px}
.pend button{border:0;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;font-weight:500;margin-top:4px}
@media (max-width:760px){.strip{grid-template-columns:1fr}.pend{max-width:none}}

/* excel-like table */
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;box-shadow:0 1px 0 var(--line)}
table{width:100%;border-collapse:collapse;min-width:1000px}
thead th{position:sticky;top:0;z-index:1;background:var(--verde);color:#fff;font-weight:700;font-size:14.5px;text-align:left;padding:12px 12px;letter-spacing:.01em}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top;font-size:14.5px;line-height:1.4}
tr.wkrow td{background:var(--verde2);color:#fff;font-weight:700;font-size:15px;padding:10px 12px;border-top:0}
tr.wkrow td span{font-weight:400;opacity:.9;margin-left:10px}
tr.wkrow td .addw{float:right;margin-left:6px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-weight:500;border-radius:7px;padding:2px 10px}
tr.wkrow td .addw:hover{background:rgba(255,255,255,.15)}
tr.act{cursor:pointer}
tr.act.alt td{background:var(--tinte2)}
tr.act:hover td{background:var(--tinte)}
tr.act.cont td{border-top:1px dashed var(--line)}
tr.act.cont td.d>*{visibility:hidden}
tr.act.cont td.dd{color:transparent}
td.d{white-space:nowrap;width:70px;text-align:center}
td.d b{display:block;font-size:24px;line-height:1;color:var(--verde2)}
td.d small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
td.dd{white-space:nowrap;font-weight:700}
td.h{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;color:var(--verde2)}
td.a{font-weight:700;min-width:190px}
td.tm{min-width:220px;color:var(--muted);font-size:14px}
td.lg{min-width:120px}
td.p{min-width:150px}
td.p div{overflow-wrap:anywhere}
td.tm div{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
td.o{min-width:110px}
td.o span{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:13px}
tr.empty td{color:var(--muted);font-style:italic;padding:7px 12px;font-size:13.5px}
tr.today td.dd::after{content:"hoy";margin-left:6px;background:var(--amarillo);color:#1F2A1C;border-radius:5px;padding:1px 6px;font-size:11.5px}
.weeknav{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.weeknav h2{margin:0 auto 0 4px;font-size:18px}
/* screenshot card */
#shotDlg{width:min(1180px,96vw);max-height:94vh;overflow:auto}
#shotDlg .bar2{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;flex-wrap:wrap}
#shotDlg .bar2 span{margin-right:auto;color:var(--muted);font-size:13px}
.shot{background:#fff;color:#1F2A1C;padding:26px 28px 18px;font-family:Ubuntu,Arial,sans-serif}
.shot .sh{display:flex;align-items:center;gap:22px;border-bottom:4px solid #43883D;padding-bottom:14px;margin-bottom:16px}
.shot .sh img{height:70px}
.shot .sh div{margin-left:auto;text-align:right}
.shot .sh h2{margin:0;font-size:24px;color:#285F19}
.shot .sh .g{display:inline-block;margin:6px 0 0;background:#D8E5B0;color:#285F19;font-size:21px;font-weight:700;padding:5px 14px;border-radius:9px;border-left:6px solid #F8DC0B}
.shot .sh p{margin:6px 0 0;font-size:16px;color:#1F2A1C;font-weight:500}
.shot table{min-width:0;border:1px solid #D5E0CC}
.shot th{background:#285F19;color:#fff;font-size:15px;padding:10px 12px;text-align:left;font-weight:700}
.shot td{font-size:15px;padding:10px 12px;border-top:1px solid #D5E0CC;color:#1F2A1C;vertical-align:top}
.shot tr.day td{background:#EAF2E1;font-weight:700;color:#285F19;font-size:15.5px;border-top:2px solid #43883D}
.shot td.hh{white-space:nowrap;font-weight:700;color:#43883D;width:100px}
.shot td.aa{font-weight:700;width:30%}
.shot .tt{color:#5C6B57;font-size:14px}
.shot .ft{display:flex;justify-content:space-between;color:#7A8775;font-size:12.5px;margin-top:10px}
.shot .none{padding:30px;text-align:center;color:#5C6B57;font-size:16px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:17px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:14px}
.loading{color:var(--muted);padding:40px;text-align:center}

/* dialogs */
dialog{border:0;border-radius:16px;padding:0;width:min(600px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(20,40,15,.45)}
dialog form{padding:20px 22px}
dialog h2{margin:0 0 12px;font-size:19px;color:var(--verde2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
dialog input,dialog textarea{font-weight:400;border:1px solid var(--line);background:var(--tinte2);border-radius:9px;padding:9px 10px;color:var(--ink)}
dialog textarea{resize:vertical;min-height:62px}
.req{color:#C20E1A;font-weight:400}
fieldset.team{border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;margin:0}
fieldset.team legend{font-size:13px;font-weight:500;color:var(--muted);padding:0 4px}
#teamChecks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px}
#teamChecks label{flex-direction:row;align-items:center;gap:8px;font-weight:400;color:var(--ink);font-size:14px;padding:5px 2px;cursor:pointer}
#teamChecks input{width:18px;height:18px;accent-color:#43883D;padding:0}
.doubt{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:13.5px}
.factions{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.factions div{display:flex;gap:8px}
.ferr{color:#C20E1A;font-size:13px;margin-top:8px;min-height:1em}
.footer{margin-top:14px;display:flex;justify-content:flex-end}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}.search{margin-left:0;max-width:none}}
</style>
</head>

<script>
(function(){
const MONTHS=[{m:8,name:'Septiembre'},{m:9,name:'Octubre'},{m:10,name:'Noviembre'},{m:11,name:'Diciembre'}];
const YEAR=2026;
const DOW=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const API='https://script.google.com/macros/s/AKfycbzPFyCS5gX3MALPspfQ4uZmWEMHHMM74GYxWx7ooX9AiW3yiB1bG6-tzbOHx94Lj2_r/exec';
let items=[],team=[],loaded=false,canWrite=true,col=true;
const today=new Date();today.setHours(0,0,0,0);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtHora=h=>{if(!h)return'';const[H,M]=h.split(':').map(Number);return((H%12)||12)+':'+pad(M)+(H<12?' a. m.':' p. m.')};
const isInc=it=>!it.actividad||!it.hora||!it.tema;
const nowIdx=MONTHS.findIndex(x=>x.m===today.getMonth()&&today.getFullYear()===YEAR);
let state={month:nowIdx>=0?nowIdx:0,view:'mes',week:null,q:''};

function defaultWeek(i){
  const m=MONTHS[i].m,first=new Date(YEAR,m,1),last=new Date(YEAR,m+1,0);
  for(const c of [monday(addDays(today,7)),monday(today)]) if(addDays(c,6)>=first&&c<=last) return c;
  return monday(first);
}
function weeksOf(i){const m=MONTHS[i].m,last=new Date(YEAR,m+1,0),o=[];for(let w=monday(new Date(YEAR,m,1));w<=last;w=addDays(w,7))o.push(w);return o}
function filtered(){
  const q=state.q.trim().toLowerCase();let a=items;
  if(q)a=a.filter(it=>[it.actividad,it.tema,it.lugar,it.participantes,it.observaciones].join(' ').toLowerCase().includes(q));
  return a.slice().sort((x,y)=>(x.fecha+(x.hora||'99')).localeCompare(y.fecha+(y.hora||'99')));
}
function inMonth(it,i){const d=parse(it.fecha);return d.getFullYear()===YEAR&&d.getMonth()===MONTHS[i].m}
function rangeTxt(w,i){
  const m=MONTHS[i].m;let s=w,e=addDays(w,6);
  if(s.getMonth()!==m)s=new Date(YEAR,m,1); if(e.getMonth()!==m)e=new Date(YEAR,m+1,0);
  return `${DOW[(s.getDay()+6)%7]} ${s.getDate()} al ${DOW[(e.getDay()+6)%7].toLowerCase()} ${e.getDate()} de ${MES[m]}`;
}

function people(p){return esc(p).split(/\s*;\s*/).filter(Boolean).map(x=>`<div>${x}</div>`).join('')}
function rowsFor(list,w,i){
  let html='',prev='',alt=true;
  if(!list.length) return `<tr class="empty"><td colspan="8">Sin actividades esta semana.</td></tr>`;
  list.forEach(it=>{
    const d=parse(it.fecha),first=it.fecha!==prev;if(first)alt=!alt;prev=it.fecha;
    html+=`<tr class="act ${first?'first':'cont'}${alt?' alt':''}${it.fecha===iso(today)&&first?' today':''}" data-id="${esc(it.id)}" tabindex="0">
      <td class="d"><b>${pad(d.getDate())}</b><small>${MES[d.getMonth()].slice(0,3)}</small></td>
      <td class="dd">${DOW[(d.getDay()+6)%7]}</td>
      <td class="h">${it.hora?fmtHora(it.hora):''}</td>
      <td class="a">${esc(it.actividad)}</td>
      <td class="tm"><div>${esc(it.tema)}</div></td>
      <td class="lg">${esc(it.lugar)}</td>
      <td class="p">${people(it.participantes)}</td>
      <td class="o">${it.observaciones?`<span>${esc(it.observaciones)}</span>`:''}</td></tr>`;
  });
  return html;
}
function tableHTML(weeks){
  const i=state.month,all=filtered().filter(it=>inMonth(it,i));
  let body='';
  weeks.forEach(w=>{
    const e=addDays(w,6),list=all.filter(it=>{const d=parse(it.fecha);return d>=w&&d<=e});
    const n=weeksOf(i).findIndex(x=>iso(x)===iso(w))+1;
    body+=`<tr class="wkrow"><td colspan="8">Semana ${n} <span>${rangeTxt(w,i)} · ${list.length} ${list.length===1?'actividad':'actividades'}</span><button type="button" class="addw" data-shot="${iso(w)}">Imagen</button>${canWrite&&col?`<button type="button" class="addw" data-add="${iso(w<new Date(YEAR,MONTHS[i].m,1)?new Date(YEAR,MONTHS[i].m,1):w)}">+ Agregar</button>`:''}</td></tr>`+rowsFor(list,w,i);
  });
  return `<div class="tablebox"><table><thead><tr><th>Fecha</th><th>Día</th><th>Hora</th><th>Actividad</th><th>Tema / alcance</th><th>Lugar</th><th>Participantes / entidades</th><th>Observaciones</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function render(){
  const i=state.month,all=filtered();
  document.getElementById('mbadge').innerHTML=`${MONTHS[i].name.toUpperCase()}<small>${YEAR}</small>`;
  document.getElementById('months').innerHTML=MONTHS.map((x,k)=>`<button type="button" data-m="${k}" aria-pressed="${k===i}"><b>${x.name}</b>${loaded?`<span>${all.filter(it=>inMonth(it,k)).length}</span>`:''}</button>`).join('');
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===state.view));
  if(!loaded)return;
  const mon=all.filter(it=>inMonth(it,i)),weeks=weeksOf(i);
  if(!state.week)state.week=defaultWeek(i);
  const counts=weeks.map(w=>mon.filter(it=>{const d=parse(it.fecha);return d>=w&&d<=addDays(w,6)}).length),max=Math.max(1,...counts);
  const inc=mon.filter(isInc);
  document.getElementById('strip').innerHTML=`
    <div class="kpi"><div class="n">${mon.length}</div><p>actividades en ${MONTHS[i].name.toLowerCase()}</p></div>
    <div class="weeks">${weeks.map((w,k)=>`<button type="button" class="wk" data-gow="${iso(w)}" aria-current="${state.view==='semana'&&iso(w)===iso(state.week)}" title="Ver semana ${k+1}"><b>${counts[k]}</b><span class="b" style="height:${6+counts[k]/max*38}px"></span>Sem ${k+1}</button>`).join('')}</div>
    <div class="pend">${inc.length?`${inc.length} ${inc.length===1?'actividad tiene':'actividades tienen'} datos por completar (hora, tema o nombre).<br><button type="button" id="incBtn">Ver cuáles</button>`:'Todas las actividades del mes tienen hora y tema.'}</div>`;
  const main=document.getElementById('main');
  if(state.view==='mes') main.innerHTML=tableHTML(weeks);
  else{
    const w=state.week,n=weeks.findIndex(x=>iso(x)===iso(w))+1;
    main.innerHTML=`<div class="weeknav"><button type="button" class="iconbtn" data-wk="-1" aria-label="Semana anterior">‹</button><button type="button" class="iconbtn" data-wk="1" aria-label="Semana siguiente">›</button><h2>Semana ${n||''}: ${rangeTxt(w,i)}</h2><button type="button" class="btn" id="shotBtn">Imagen para compartir</button></div>`+tableHTML([w]);
  }
  document.getElementById('addBtn').disabled=!canWrite||!col;
  }

// events
document.addEventListener('click',e=>{
  const t=e.target.closest('button,tr.act');if(!t)return;
  if(t.id==='shotBtn'){openShot(state.week);return}
  if(t.dataset.shot){openShot(parse(t.dataset.shot));return}
  if(t.id==='incBtn'){state.q='';document.getElementById('search').value='';const f=items.filter(it=>inMonth(it,state.month)&&isInc(it));if(f[0])openForm(f[0]);return}
  if(t.dataset.m!==undefined){state.month=+t.dataset.m;state.week=defaultWeek(state.month);render();return}
  if(t.dataset.view){state.view=t.dataset.view;render();return}
  if(t.dataset.wk){state.week=addDays(state.week,7*+t.dataset.wk);const mi=MONTHS.findIndex(x=>x.m===addDays(state.week,3).getMonth());if(mi>=0)state.month=mi;render();return}
  if(t.dataset.gow){state.week=parse(t.dataset.gow);state.view='semana';render();return}
  if(t.dataset.add){openForm(null,{fecha:t.dataset.add});return}
  if(t.dataset.id){const it=items.find(x=>x.id===t.dataset.id);if(it)openForm(it)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr.act'))e.target.click()});
let qt;document.getElementById('search').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value;render()},150)});
document.getElementById('addBtn').addEventListener('click',()=>{const m=MONTHS[state.month].m;openForm(null,{fecha:iso(today.getMonth()===m?today:new Date(YEAR,m,1))})});

// activity form
const dlg=document.getElementById('dlg'),form=document.getElementById('form');let editing=null,delArmed=false;
function openForm(it,pre){
  editing=it;pre=pre||{};const src=it||pre;
  document.getElementById('dlgTitle').textContent=it?(canWrite?'Editar actividad':'Actividad'):('Agregar actividad');
  const dbx=document.getElementById('doubt');dbx.hidden=!pre.dudas;dbx.textContent=pre.dudas?'Revisa: '+pre.dudas:'';
  document.getElementById('ferr').textContent='';
  const f=form.elements;['fecha','hora','actividad','tema','lugar','observaciones'].forEach(k=>{f[k].value=src[k]||''});
  const parts=String(src.participantes||'').split(/\s*;\s*/).filter(Boolean);
  const checked=new Set(parts.filter(p=>team.includes(p)));
  f.otros.value=parts.filter(p=>!team.includes(p)).join('; ');
  document.getElementById('teamChecks').innerHTML=team.map((n,k)=>`<label><input type="checkbox" value="${esc(n)}"${checked.has(n)?' checked':''}>${esc(n)}</label>`).join('');
  document.getElementById('saveBtn').hidden=!canWrite;
  const del=document.getElementById('delBtn');del.hidden=!(it&&canWrite);del.textContent='Eliminar';delArmed=false;
  document.getElementById('lugares').innerHTML=[...new Set(items.map(x=>x.lugar).filter(Boolean))].sort().map(l=>`<option value="${esc(l)}">`).join('');
  dlg.showModal();
}
document.getElementById('cancelBtn').addEventListener('click',()=>dlg.close());
document.getElementById('delBtn').addEventListener('click',async e=>{
  if(!delArmed){delArmed=true;e.target.textContent='Confirmar eliminación';return}
  try{await enviar('eliminar',{id:editing.id});dlg.close()}catch(_){document.getElementById('ferr').textContent='No se pudo eliminar. Revisa la conexión e intenta de nuevo.'}
});
form.addEventListener('submit',async e=>{
  e.preventDefault();const f=form.elements,err=document.getElementById('ferr');
  const data={};['fecha','hora','actividad','tema','lugar','observaciones'].forEach(k=>data[k]=f[k].value.trim());
  const sel=[...document.querySelectorAll('#teamChecks input:checked')].map(x=>x.value);
  data.participantes=sel.concat(f.otros.value.split(/\s*;\s*/).map(x=>x.trim()).filter(Boolean)).join('; ');
  if(!data.fecha){err.textContent='Falta la fecha.';f.fecha.focus();return}
  const d=parse(data.fecha);if(d.getFullYear()!==YEAR||d.getMonth()<8){err.textContent='La fecha debe estar entre septiembre y diciembre de 2026.';return}
  if(!data.actividad){err.textContent='Escribe el nombre de la actividad.';f.actividad.focus();return}
  const b=document.getElementById('saveBtn');b.disabled=true;b.textContent='Guardando…';
  try{
    if(editing){data.id=editing.id;await enviar('editar',data)}else await enviar('agregar',data);
    dlg.close();const mi=MONTHS.findIndex(x=>x.m===d.getMonth());if(mi>=0)state.month=mi;state.week=monday(d);
    render();
  }catch(ex){err.textContent='No se pudo guardar. Revisa la conexión e intenta de nuevo.'}
  finally{b.disabled=false;b.textContent='Guardar'}
});

// screenshot card
let shotWeek=null;
function shotHTML(w,fixed){
  const e=addDays(w,6),list=filtered().filter(it=>{const d=parse(it.fecha);return d>=w&&d<=e});
  const mi=MONTHS.findIndex(x=>x.m===addDays(w,3).getMonth());
  const rng=`${w.getDate()} ${w.getMonth()!==e.getMonth()?'de '+MES[w.getMonth()]+' ':''}al ${e.getDate()} de ${MES[e.getMonth()]} de ${e.getFullYear()}`;
  let rows='',prev='';
  list.forEach(it=>{
    const d=parse(it.fecha);
    if(it.fecha!==prev){rows+=`<tr class="day"><td colspan="4">${DOW[(d.getDay()+6)%7]} ${d.getDate()} de ${MES[d.getMonth()]}</td></tr>`;prev=it.fecha}
    rows+=`<tr><td class="hh">${it.hora?fmtHora(it.hora):''}</td><td class="aa">${esc(it.actividad)}${it.tema?`<div class="tt" style="font-weight:400;margin-top:3px">${esc(it.tema)}</div>`:''}</td><td>${esc(it.lugar)}</td><td>${people(it.participantes)}</td></tr>`;
  });
  const logo=document.querySelector('.head img').src;
  return `<div class="shot" ${fixed?'style="width:1200px"':''}>
    <div class="sh"><img src="${logo}" alt=""><div><h2>Cronograma de actividades</h2><div class="g">Grupo Recurso Hídrico</div><p>Semana del ${rng}</p></div></div>
    ${list.length?`<table style="width:100%;border-collapse:collapse"><thead><tr><th>Hora</th><th>Actividad</th><th>Lugar</th><th>Participantes</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="none">Sin actividades programadas esta semana.</div>`}
    <div class="ft"><span>Grupo Recurso Hídrico</span><span>${list.length} ${list.length===1?'actividad':'actividades'}</span></div></div>`;
}
const shotDlg=document.getElementById('shotDlg');
function openShot(w){shotWeek=w;document.getElementById('shotBody').innerHTML=shotHTML(w,false);shotDlg.showModal()}
document.getElementById('shotClose').addEventListener('click',()=>shotDlg.close());
function loadScript(src){return new Promise((ok,ko)=>{if(window.html2canvas)return ok();const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)})}
document.getElementById('shotDl').addEventListener('click',async e=>{
  const b=e.target,hint=document.getElementById('shotHint');b.disabled=true;b.textContent='Generando…';
  const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-99999px;top:0';holder.innerHTML=shotHTML(shotWeek,true);document.body.appendChild(holder);
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const canvas=await html2canvas(holder.firstElementChild,{scale:2,backgroundColor:'#ffffff'});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    const name=`Cronograma semana ${iso(shotWeek)}.png`,file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Cronograma de la semana'});hint.textContent='Listo.';}catch(_){hint.textContent='Compartir cancelado.'}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);hint.textContent='Imagen descargada.';}
  }catch(err){hint.textContent='No se pudo generar la imagen. Toma el pantallazo del recuadro.'}
  finally{holder.remove();b.disabled=false;b.textContent='Descargar / compartir imagen'}
});

// data
function notice(t){const n=document.getElementById('notice');n.textContent=t;n.hidden=!t}
function aplicar(d){
  if(!d||!Array.isArray(d.actividades))throw new Error('respuesta');
  items=d.actividades.filter(x=>x.id&&/^\d{4}-\d{2}-\d{2}$/.test(x.fecha));
  if(Array.isArray(d.equipo)&&d.equipo.length)team=d.equipo;
  loaded=true;notice('');render();
}
async function cargar(){
  try{const r=await fetch(API);aplicar(await r.json())}
  catch(_){if(!loaded){document.getElementById('main').innerHTML='';}notice('No se pudieron cargar las actividades. Revisa tu conexión y recarga la página.')}
}
async function enviar(accion,datos){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({accion,datos})});
  const d=await r.json();if(!d.ok)throw new Error(d.error||'error');aplicar(d);
}
render();cargar();
setInterval(()=>{if(!document.hidden&&!dlg.open)cargar()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)cargar()});
})();
</script>
</body>
</html>
